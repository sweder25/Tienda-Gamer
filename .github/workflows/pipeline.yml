name: CI/CD - Spring Boot + React (Render)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  # 🔐 Variables globales para Render
  RENDER_BACKEND_DEPLOY_HOOK:  ${{ 611287ae15aca5c05a369d29cc9b8573 }}
  RENDER_FRONTEND_DEPLOY_HOOK: ${{ c31d88cf05f6924f0010243a8808f81b }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # ============================
      # 🅱 BACKEND (Spring Boot)
      # ============================

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend
        run: |
          cd Tienda-Gamer_back
          mvn clean install -DskipTests=false

      # ============================
      # 🎨 FRONTEND (React)
      # ============================

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Frontend
        run: |
          cd TIENDA_GAMER_FRONT
          npm install
          npm run build

      # ============================
      # 🚀 DESPLIEGUE A RENDER
      # ============================

      - name: Deploy Backend to Render
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Desplegando backend..."
          curl -X POST "$RENDER_BACKEND_DEPLOY_HOOK"

      - name: Deploy Frontend to Render
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Desplegando frontend..."
          curl -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"

      # ============================
      # 🔔 Notificación
      # ============================

      - name: Notify
        run: |
          echo "Pipeline completado correctamente 🚀"
